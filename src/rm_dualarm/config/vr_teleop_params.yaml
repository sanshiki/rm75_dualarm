# ================================================================
# VR teleoperation parameters
# ================================================================
# Loaded by vr_teleop.launch.py for the full VR pipeline:
#   ROS-TCP-Endpoint → vr_base_broadcaster → vr_teleop_node

# ---- ROS-TCP-Endpoint (Unity ↔ ROS bridge) ----
ros_tcp_endpoint:
  ros__parameters:
    ROS_IP: "192.168.1.100"
    ROS_TCP_PORT: 10024

# ---- VR base broadcaster (headset TF → vr_base frame) ----
vr_base_broadcaster:
  ros__parameters:
    odom_frame: "odom"
    headset_frame: "headset"
    use_headset_yaw: false
    rate: 30.0

# ---- VR teleop node (hand TF → /target_pose) ----
vr_teleop:
  ros__parameters:
    control_mode: single
    target_topic: /target_pose
    left_target_topic: /left/target_pose
    right_target_topic: /right/target_pose
    active_topic: /teleop_active
    left_active_topic: /left/teleop_active
    right_active_topic: /right/teleop_active
    servo_bridge_stop_topic: /servo_bridge/stop
    left_gripper_topic: /left/gripper_cmd
    right_gripper_topic: /right/gripper_cmd
    joy_topic: /quest/joystick
    vr_base_frame: vr_base
    vr_origin_frame: vr_origin
    vr_hand_frame: hand_right
    left_vr_hand_frame: hand_left
    right_vr_hand_frame: hand_right
    base_frame: base_link
    left_base_frame: left_base_link
    right_base_frame: right_base_link
    publish_rate: 50.0
    p_sensitivity: 4.0
    q_sensitivity: 4.0
    user_height: 1.75
    dual_y_offset: 0.2

    # ---- Calibration / face-to-face operation ----
    # Empty calibration_file uses config/vr_calibration.yaml from this package.
    calibration_enabled: true
    calibration_file: ""
    mirror_mode: false
    standby_pose_file: ""
    record_output_prefix: bags/vr_teleop
    target_filter_enabled: true
    target_filter_alpha: 0.6
