# ================================================================
# PID parameters for MoveIt2 Servo PoseTracking
# ================================================================
# Loaded alongside servo YAML by servo_pose_tracking_demo.
# Reference:
#   /opt/ros/humble/share/moveit_servo/config/pose_tracking_settings.yaml
#   /opt/ros/humble/include/moveit_servo/pose_tracking.h
#
# Gains are tuned conservatively for RM75 to avoid oscillation.

# Maximum value of error integral (anti-windup)
windup_limit: 0.05

# ---- Translation PID gains ----
x_proportional_gain: 1.0
y_proportional_gain: 1.0
z_proportional_gain: 1.0
x_integral_gain: 0.0
y_integral_gain: 0.0
z_integral_gain: 0.0
x_derivative_gain: 0.0
y_derivative_gain: 0.0
z_derivative_gain: 0.0

# ---- Orientation PID gains ----
angular_proportional_gain: 0.5
angular_integral_gain: 0.0
angular_derivative_gain: 0.0
