# ================================================================
# PID parameters for MoveIt2 Servo PoseTracking
# ================================================================
# Loaded alongside servo YAML by servo_pose_tracking_demo.
# Reference:
#   /opt/ros/humble/share/moveit_servo/config/pose_tracking_settings.yaml
#   /opt/ros/humble/include/moveit_servo/pose_tracking.h
#
# Gains are tuned conservatively for RM75 to avoid oscillation.

# Maximum value of error integral (anti-windup)
windup_limit: 0.05

# ---- Translation PID gains ----
x_proportional_gain: 1.5
y_proportional_gain: 1.5
z_proportional_gain: 1.5
x_integral_gain: 0.0
y_integral_gain: 0.0
z_integral_gain: 0.0
x_derivative_gain: 0.1
y_derivative_gain: 0.1
z_derivative_gain: 0.1

# ---- Orientation PID gains ----
orientation_tracking_mode: full_quat # full_quat | yaw_only
angular_proportional_gain: 1.5
angular_integral_gain: 0.0
angular_derivative_gain: 0.0

# ---- Low-pass filter (first-order: y[n] = α·x[n] + (1-α)·y[n-1]) ----
# Applied to TwistStamped output before publishing to servo_node_main.
filter_enabled: false            # true = enable smoothing
filter_alpha: 0.3                # 0.0 = max smooth, 1.0 = bypass

# ---- Safe zone — clamp target_pose before tracking ----
# Prevents the arm from being commanded to unreachable positions.
safe_zone_enabled: true
x_min: 0.15
x_max: 0.50
y_min: -0.30
y_max: 0.30
z_min: 0.30
z_max: 0.50

# ---- Soft-start ramp ----
# Multiplies the output twist by a 0→1 coefficient that ramps up over
# soft_start_ramp_time seconds.  Resets to 0 whenever target_pose is
# absent for > 0.3 s (e.g. mouse released / VR deactivated).
# Set to 0 to disable.
soft_start_ramp_time: 2.0
