# RM75 机器人开发 Conda 环境配置
# 用法:
#   conda env create -f rm75_env.yaml
#   conda activate rm75
#
# 注意: 激活环境后还需 source ROS 2 Humble 的 setup.bash
#   source /opt/ros/humble/setup.bash
#   source install/setup.bash  # 如果在工作空间内

name: rm75
channels:
  - conda-forge
  - defaults

dependencies:
  # ============================================================
  # Python 3.10 — 必须与 ROS 2 Humble 的 Python 版本一致
  # 系统 ROS 2 的 C 扩展 (rclpy, _rclpy_pybind11 等) 均为此版本编译
  # ============================================================
  - python=3.10

  # ============================================================
  # 科学计算与数学
  # ============================================================
  - numpy>=1.23,<2.0              # 数值计算，ROS 2 msg 序列化依赖
  - scipy                         # 插值、优化、信号处理（rm_control cubicSpline 等场景）
  - pybind11                      # C++/Python 绑定（与 rclpy 同机制）

  # ============================================================
  # 机器人开发常用
  # ============================================================
  - pyyaml                        # YAML 解析（ROS 2 launch/config 文件读取）
  - lxml                          # XML 解析（URDF/XACRO 文件处理）
  - transforms3d                  # 3D 位姿转换（欧拉角↔四元数↔旋转矩阵）
  - urdf-parser-py                # URDF 文件解析

  # ============================================================
  # 计算机视觉
  # ============================================================
  - opencv                        # OpenCV（C++/Python，体感智能常用）
  - pillow                        # 图像处理

  # ============================================================
  # 数据处理与可视化
  # ============================================================
  - matplotlib                    # 曲线/轨迹/joint state 可视化
  - pandas                        # 数据处理与记录分析
  - ipython                       # 交互式 Python shell
  - jupyter                       # Jupyter notebook 用于调试/分析

  # ============================================================
  # 工程与开发
  # ============================================================
  - pytest                        # 单元测试
  - flake8                        # Python 代码风格检查（ROS 2 ament linter 使用）
  - black                         # Python 代码格式化
  - pylint                        # 静态分析
  - empy                          # 模板引擎（colcon build 某些包需要）
  - catkin_pkg                    # ROS 包元信息解析
  - rosdistro                     # ROS 发行版信息
  - colcon-common-extensions      # colcon 构建工具（build/test/lint）

  # ============================================================
  # 网络与通信
  # ============================================================
  - zeromq                        # 高性能消息队列（自定义通信需求）
  - setuptools                    # Python 包构建
  - wheel                         # Python 包分发

  # ============================================================
  # pip 安装的包（conda 源中没有或需要特定版本）
  # ============================================================
  - pip
  - pip:
    - ikpy                         # 逆运动学求解库
    - spatialmath-python           # 空间数学库（位姿矩阵、变换等）
    - pylink                       # 运动学链建模
